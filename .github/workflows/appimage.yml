name: Build AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cli-chess
        run: |
          python -m pip install .

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download quick-sharun
        run: |
          curl -L \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh \
            -o quick-sharun
          chmod +x quick-sharun

      - name: Build AppImage
        env:
          ICON: ${{ github.workspace }}/cli-chess.png
          DESKTOP: ${{ github.workspace }}/cli-chess.desktop
          OUTPATH: ${{ github.workspace }}/dist
          OUTNAME: cli-chess-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          mkdir -p dist

          ./quick-sharun "$(which cli-chess)"
          ./quick-sharun --make-appimage

      - name: Test AppImage
        run: |
          ./quick-sharun --test dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-chess-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.zsync
