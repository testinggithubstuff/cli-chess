name: Build AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pip
          get-debloated-pkgs --add-common --prefer-nano

      - name: Install cli-chess
        run: |
          python -m pip install --break-system-packages .

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download quick-sharun
        run: |
          curl -L \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh \
            -o quick-sharun
          chmod +x quick-sharun

      - name: Build AppImage
        env:
          ICON: ${{ github.workspace }}/cli-chess.png
          OUTPATH: ${{ github.workspace }}/dist
          OUTNAME: cli-chess-${{ steps.version.outputs.version }}-x86_64.AppImage
        run: |
          mkdir -p dist
          ./quick-sharun "$(which cli-chess)"
          ./quick-sharun --make-appimage

      - name: Test AppImage
        run: |
          ./quick-sharun --test ./dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-chess-${{ steps.version.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.zsync
